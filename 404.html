<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found | dottmp</title>
    <meta
      name="description"
      content="The page you were looking for could not be found."
    />
    <link rel="icon" href="favicon.ico" />
    <link rel="stylesheet" href="dist/output.css" />

    <script type="module">
      import { asciiPrint } from "./src/ascii-print.js";

      const banner = `
        :::      :::::::      ::: 
      :+:      :+:   :+:    :+:   
    +:+ +:+   +:+   +:+   +:+ +:+ 
  +#+  +:+   +#+   +:+  +#+  +:+  
+#+#+#+#+#+ +#+   +#+ +#+#+#+#+#+ 
     #+#   #+#   #+#       #+#    
    ###    #######        ###     
                                  
              page not found`;

      asciiPrint(document.getElementById("ascii-banner"), banner, {
        chunkSize: 16,
      });
    </script>
  </head>

  <body
    class="min-h-screen bg-background flex items-center flex-col justify-center p-4"
  >
    <main
      class="container m-auto flex max-w-xl items-center justify-center overflow-hidden italic"
    >
      <pre
        id="ascii-banner"
        aria-hidden="true"
        style="background: transparent"
        class="font-mono text-xs leading-3 -tracking-widest text-foreground h-32"
      ></pre>

      <h1 class="sr-only">404 — page not found</h1>
    </main>
  </body>
</html>
