<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found</title>
    <meta
      name="description"
      content="The page you were looking for could not be found."
    />
    <link rel="icon" href="favicon.ico" />
    <link rel="stylesheet" href="src/app.css" />

    <script type="module">
      import { asciiPrint } from "./src/ascii-print.js";

      const banner = `
        :::      :::::::      ::: 
      :+:      :+:   :+:    :+:   
    +:+ +:+   +:+   +:+   +:+ +:+ 
  +#+  +:+   +#+   +:+  +#+  +:+  
+#+#+#+#+#+ +#+   +#+ +#+#+#+#+#+ 
     #+#   #+#   #+#       #+#    
    ###    #######        ###     
                                  
              page not found`;

      asciiPrint(document.getElementById("ascii-not-found-banner"), banner, {
        chunkSize: 16,
      });
    </script>
  </head>

  <body>
    <main id="not-found-page">
      <pre id="ascii-not-found-banner" aria-hidden="true" class="ascii"></pre>

      <h1 class="sr-only">404 — page not found</h1>
    </main>
  </body>
</html>
